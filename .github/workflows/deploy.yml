name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npm run typecheck

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # .env はリポジトリに含めないため、テストでは Firebase SDK の初期化が
      # 通るだけのダミー値を渡す（Emulator接続のみで実プロジェクトへは接続しない）
      - name: Unit tests + Rules tests (Emulator)
        run: firebase emulators:exec --only firestore "npm run test"
        env:
          VITE_FIREBASE_API_KEY: test-api-key
          VITE_FIREBASE_AUTH_DOMAIN: damesi-test.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: damesi-test
          VITE_FIREBASE_STORAGE_BUCKET: damesi-test.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
          VITE_FIREBASE_APP_ID: "1:000000000000:web:test"
          VITE_USE_EMULATOR: "false"

      - name: Build
        run: npm run build
        env:
          # 実プロジェクトの値。GitHub Secrets に登録が必要
          # （未登録だと Firebase 設定が空のままビルドされ、アプリが動作しない）
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_EMULATOR: "false"

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # 実プロジェクトの値。GitHub Secrets に登録が必要
          # （未登録だと Firebase 設定が空のままビルドされ、アプリが動作しない）
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_USE_EMULATOR: "false"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # FIREBASE_TOKEN は GitHub Secrets に登録（firebase login:ci で取得）
      # CLAUDE APIキー等の秘匿情報はここに置かず Firebase Secret Manager で管理
      - name: Deploy to Firebase
        run: firebase deploy --only hosting,firestore,storage --project "${{ secrets.FIREBASE_PROJECT_ID }}" --token "${{ secrets.FIREBASE_TOKEN }}"
